{% load i18n %}
{% load thumb %}
{% load duration %}
<li class="dc-card">
  <a class="episode"
     href="{{ item.url }}"
     title="{{ item.display_title }}"
     data-uuid="{{ item.uuid }}"
     data-media="{{ item.media_url }}"
     data-cover="{{ item.display_cover_image_url }}"
     data-title="{{ item.title }}"
     data-album="{{ item.program.display_title }}"
     data-hosts="{{ item.program.host|join:' / ' }}"
     {% if request.user.is_authenticated %}data-comment-href="{% url 'journal:comment' item.uuid %}"{% endif %}
     data-position="0">
    <span class="dc-cover sq">
      <img src="{{ item.display_cover_image_url|relative_uri }}"
           alt="{{ item.display_title }}"
           loading="lazy">
      <span class="dc-play" aria-hidden="true"><i class="fa-solid fa-play"></i></span>
    </span>
    <span class="dc-title">{{ item.title }}</span>
    <span class="dc-meta">{{ item.program.display_title }}</span>
  </a>
</li>
