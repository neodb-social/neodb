{% load i18n %}
{% load discover %}
<li class="dc-card dc-card-dismissed"
    data-category="{{ item.category.value }}">
  <span class="dc-cover {{ item|cover_shape }}">
    <span class="dc-dismissed-note">
      {% trans "Hidden from recommendations." %}
      <button type="button"
              class="dc-btn outline secondary"
              hx-post="{% url 'catalog:restore_recommendation' item.uuid %}"
              hx-target="closest li"
              hx-swap="outerHTML">{% trans "Undo" %}</button>
    </span>
  </span>
  <span class="dc-title">{{ item.display_title }}</span>
</li>
