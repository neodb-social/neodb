{% load i18n %}
<details class="compose-menu"
         _="on click from elsewhere remove @open from me on click if the target is me remove @open from me end on keydown[key=='Escape'] from document if me.open then remove @open from me then set btn to the first <summary/> in me then call btn.focus() end on click from <.compose-item/> in me remove @open from me on toggle if me.open then set itm to the first <.compose-item/> in me then wait 50ms then call itm.focus({preventScroll:true}) end">
  <summary class="dc-nav{% if primary %} primary{% endif %}"
           title="{% trans 'Compose' %}"
           aria-haspopup="menu">
    <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>
  </summary>
  <ul role="menu">
    <li role="none">
      <button type="button"
              role="menuitem"
              class="compose-item"
              hx-get="{% url 'journal:post_compose' %}"
              hx-target="body"
              hx-swap="beforeend">
        <i class="fa-regular fa-comment" aria-hidden="true"></i>
        <span>
          <strong>{% trans 'New post' %}</strong>
          <small>{% trans 'Share a short note' %}</small>
        </span>
      </button>
    </li>
    <li role="none">
      <a role="menuitem"
         class="compose-item"
         href="{% url 'journal:article_compose' %}">
        <i class="fa-regular fa-newspaper" aria-hidden="true"></i>
        <span>
          <strong>{% trans 'New article' %}</strong>
          <small>{% trans 'Write a longer piece with a title' %}</small>
        </span>
      </a>
    </li>
  </ul>
</details>
